name: Deploy

on:
  push:
    branches: [develop, production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide target directory + project name
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "DEPLOY_DIR=/home/${{ secrets.EC2_USER }}/apps/pdfchat-prod" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT=pdfchat-prod" >> $GITHUB_ENV
            echo "ENV_SECRET=PROD_ENV_FILE" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/home/${{ secrets.EC2_USER }}/apps/pdfchat-staging" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT=pdfchat-staging" >> $GITHUB_ENV
            echo "ENV_SECRET=STAGING_ENV_FILE" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Create deploy directory on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${DEPLOY_DIR}/api"

      - name: Upload project to EC2 (rsync)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".env" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${DEPLOY_DIR}

      - name: Write api/.env on EC2
        env:
          ENV_FILE_CONTENT: ${{ secrets[env.ENV_SECRET] }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "printf '%s' \"$ENV_FILE_CONTENT\" > ${DEPLOY_DIR}/api/.env"

      - name: Deploy with Docker Compose (isolated per env)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cd ${DEPLOY_DIR} && docker compose -p ${COMPOSE_PROJECT} up -d --build && docker image prune -f"
