name: Deploy

on:
  push:
    branches: [develop, production]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide target directory
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "DEPLOY_DIR=/home/${{ secrets.EC2_USER }}/apps/documentai-prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/home/${{ secrets.EC2_USER }}/apps/documentai-staging" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Upload project to EC2 (rsync)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".env" \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${DEPLOY_DIR}

      - name: Write STAGING env file on EC2
        if: github.ref_name == 'develop'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${DEPLOY_DIR}/api"
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cat > ${DEPLOY_DIR}/api/.env" <<'EOF'
          ${{ secrets.STAGING_ENV_FILE }}
          EOF

      - name: Write PROD env file on EC2
        if: github.ref_name == 'production'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${DEPLOY_DIR}/api"
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cat > ${DEPLOY_DIR}/api/.env" <<'EOF'
          ${{ secrets.PROD_ENV_FILE }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          set -e
          cd ${DEPLOY_DIR}
          docker compose up -d --build
          docker image prune -f
          EOF
